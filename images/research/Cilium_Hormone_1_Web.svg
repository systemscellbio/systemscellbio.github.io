<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- =========================================================
     Cilium_Hormone_1.svg
     (C) Jan N. Hansen, 2026
     Hormone-binding primary cilium signal-transduction animation.
     CSS-animated (loops indefinitely), transparent background.
     ========================================================= -->
<svg
   viewBox="0 0 25 35" version="1.1"
   id="svg1"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs1">
    <linearGradient
       x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse"
       gradientTransform="matrix(7.7679546,0,0,24.962096,801.86255,962.16591)"
       spreadMethod="pad" id="linearGradient23-6">
      <stop style="stop-opacity:1;stop-color:#69cd80" offset="0" id="stop22-0" />
      <stop style="stop-opacity:1;stop-color:#b5b5b5" offset="1" id="stop23-7" />
    </linearGradient>
    <linearGradient xlink:href="#linearGradient23-6" id="linearGradient67"
       gradientUnits="userSpaceOnUse"
       gradientTransform="matrix(-4.1575403,0,0,12.487666,16.07567,6.9060615)"
       x1="0" y1="0" x2="1" y2="0" spreadMethod="pad" />

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="0.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style type="text/css"><![CDATA[
      /* ===== Master timeline: 10s loop, everything shares it ===== */

      /* --- 6 drifting hormones (no binding) --- */
      .drift {
        opacity: 0;
        animation: driftMove 10s linear infinite;
      }
      .drift.d1 { animation-name: drift1; }
      .drift.d2 { animation-name: drift2; }
      .drift.d3 { animation-name: drift3; }
      .drift.d4 { animation-name: drift4; }
      .drift.d5 { animation-name: drift5; }
      .drift.d6 { animation-name: drift6; }

      /* Each drifts L->R over its 3.2s window (as % of 10s = 32%) then idle.
         cx animates via translateX; cy via translateY. We use transform. */
      @keyframes drift1 {
        0%  { transform: translate(-2px,6px);  opacity:0; }
        3%  { opacity:0.9; }
        29% { opacity:0.9; }
        32% { transform: translate(29px,3px);  opacity:0; }
        100%{ transform: translate(29px,3px);  opacity:0; }
      }
      @keyframes drift2 {
        0%,6%  { transform: translate(-2px,2px);  opacity:0; }
        9%     { opacity:0.85; }
        35%    { opacity:0.85; }
        38%    { transform: translate(29px,6px);  opacity:0; }
        100%   { transform: translate(29px,6px);  opacity:0; }
      }
      @keyframes drift3 {
        0%,11% { transform: translate(-2px,7px);  opacity:0; }
        14%    { opacity:0.9; }
        40%    { opacity:0.9; }
        43%    { transform: translate(29px,2.5px); opacity:0; }
        100%   { transform: translate(29px,2.5px); opacity:0; }
      }
      @keyframes drift4 {
        0%,17% { transform: translate(-2px,1.5px); opacity:0; }
        20%    { opacity:0.85; }
        46%    { opacity:0.85; }
        49%    { transform: translate(29px,5px);   opacity:0; }
        100%   { transform: translate(29px,5px);   opacity:0; }
      }
      @keyframes drift5 {
        0%,23% { transform: translate(-2px,5.5px); opacity:0; }
        26%    { opacity:0.85; }
        52%    { opacity:0.85; }
        55%    { transform: translate(29px,8px);   opacity:0; }
        100%   { transform: translate(29px,8px);   opacity:0; }
      }
      @keyframes drift6 {
        0%,47% { transform: translate(-2px,3px);   opacity:0; }
        50%    { opacity:0.85; }
        76%    { opacity:0.85; }
        79%    { transform: translate(29px,6.5px); opacity:0; }
        100%   { transform: translate(29px,6.5px); opacity:0; }
      }

      /* --- The ONE hormone that binds: drifts in (3.4s->5.2s) and sticks at tip --- */
      /* Window: 34% -> 52% of 10s. Starts at (-2,6.5), ends at tip (15.84,4). */
      .binder {
        opacity: 0;
        animation: binderMove 10s linear infinite;
      }
      @keyframes binderMove {
        0%,34%  { transform: translate(-2px,6.5px); opacity:0; }
        39.4%   { opacity:0.95; }                 /* ~30% into its 1.8s travel */
        /* mid approach (quadratic-ish via two steps) */
        45%     { transform: translate(8px,3px);   opacity:0.95; }
        52%     { transform: translate(15.84px,4px); opacity:0.95; } /* arrive + stick */
        60%     { transform: translate(15.84px,4px); opacity:0.95; } /* stay stuck */
        65%     { transform: translate(15.84px,4px); opacity:0; }    /* fade as flash takes over (~6.0-6.5s) */
        100%    { transform: translate(15.84px,4px); opacity:0; }
      }

      /* --- Capture glow at tip (5.2s -> 6.6s = 52% -> 66%) --- */
      .capture {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: captureGlow 10s linear infinite;
      }
      @keyframes captureGlow {
        0%,52% { opacity:0;   transform: scale(1);   }
        55%    { opacity:1;   transform: scale(2.3); }
        59%    { opacity:0.7; transform: scale(1.7); }
        63%    { opacity:1;   transform: scale(2.7); }
        66%    { opacity:0;   transform: scale(1.7); }
        100%   { opacity:0;   transform: scale(1);   }
      }

      /* --- Green ball sliding down the cilium (6.0s -> 7.3s = 60% -> 73%) --- */
      .ball {
        opacity: 0;
        offset-path: path("M 15.84,4 C 15.3,6 13.7,9 12.9,11.2 C 12.5,12.4 12.3,13.3 12.16,14.09");
        offset-rotate: 0deg;
        animation: ballSlide 10s linear infinite;
      }
      @keyframes ballSlide {
        0%,60%  { offset-distance:0%;   opacity:0; }
        61.3%   { opacity:1; }
        71%     { opacity:1; }
        73%     { offset-distance:100%; opacity:0; }
        100%    { offset-distance:100%; opacity:0; }
      }

      /* --- Cell body glow: fires when the ball ARRIVES (7.3s -> 9.5s = 73% -> 95%) --- */
      .cellglow {
        fill-opacity: 0;
        animation: cellPulse 10s linear infinite;
      }
      @keyframes cellPulse {
        0%,73% { fill-opacity:0; }
        79.6%  { fill-opacity:0.7; }   /* 30% into its 2.2s */
        86.2%  { fill-opacity:0.4; }
        95%    { fill-opacity:0; }
        100%   { fill-opacity:0; }
      }
    ]]></style>
  </defs>

  <g id="layer1">
    <!-- Cell body -->
    <path id="cellBody"
       style="fill:#d6d6d6;stroke:#000000;stroke-width:0.2;stroke-linejoin:bevel;paint-order:fill markers stroke"
       d="m 10.578853,12.085295 c -4.4907416,0 -8.1059656,3.3788 -8.1059656,7.576285 v 6.751522 c 0,4.197515 3.615224,7.576806 8.1059656,7.576806 h 3.439582 c 4.490743,0 8.105967,-3.379291 8.105967,-7.576806 V 19.66158 c 0,-4.197485 -3.615224,-7.576285 -8.105967,-7.576285 h -0.487309 c -0.0091,0.0077 -0.01745,0.01581 -0.02532,0.02426 v 0.425301 c 0,0.340675 -0.293363,0.614946 -0.657841,0.614946 h -1.391644 c -0.364482,0 -0.657845,-0.274271 -0.657845,-0.614946 v -0.42478 c -0.008,-0.0087 -0.01654,-0.01696 -0.02585,-0.02481 z" />
    <!-- Nucleus -->
    <path id="nucleus"
       d="m 15.484897,19.756122 c 2.04979,1.505252 2.284654,4.425515 0.526675,6.517269 -1.760355,2.091853 -4.851644,2.568105 -6.8990736,1.063108 -2.049789,-1.505093 -2.284664,-4.42529 -0.526675,-6.517299 1.7603546,-2.091778 4.8516446,-2.568106 6.8990736,-1.063078 z"
       style="fill:#b4b4b4;fill-rule:evenodd;stroke:#000000;stroke-width:0.2;stroke-miterlimit:10" />
    <!-- Membrane dots -->
    <path id="memdot1"
       d="m 10.195445,15.160194 c 0.207301,-0.191937 0.276552,-0.443185 0.155417,-0.561227 -0.121216,-0.118128 -0.3873206,-0.05871 -0.5946156,0.13323 -0.2073,0.191937 -0.276637,0.443105 -0.155421,0.561228 0.121135,0.118042 0.387325,0.0587 0.5946196,-0.133231 z"
       style="fill:#646464;fill-rule:evenodd;stroke:#000000;stroke-width:0.135843;stroke-miterlimit:10" />
    <path id="memdot2"
       d="m 13.91569,14.658703 c -0.02435,-0.281459 -0.180283,-0.490299 -0.347816,-0.467072 -0.167652,0.02326 -0.284003,0.269828 -0.259629,0.551282 0.02435,0.281459 0.180165,0.49032 0.347811,0.467077 0.167539,-0.02321 0.284002,-0.269833 0.259634,-0.551287 z"
       style="fill:#646464;fill-rule:evenodd;stroke:#000000;stroke-width:0.135843;stroke-miterlimit:10" />

    <!-- Green cell glow (fires on ball arrival) -->
    <path class="cellglow"
       style="fill:#5fcf78;filter:url(#softGlow)"
       d="m 10.578853,12.085295 c -4.4907416,0 -8.1059656,3.3788 -8.1059656,7.576285 v 6.751522 c 0,4.197515 3.615224,7.576806 8.1059656,7.576806 h 3.439582 c 4.490743,0 8.105967,-3.379291 8.105967,-7.576806 V 19.66158 c 0,-4.197485 -3.615224,-7.576285 -8.105967,-7.576285 z" />

    <!-- Cilium (static) -->
    <path id="ciliumShaft"
       d="M 15.029647,7.4436265 C 13.349216,8.9382529 12.671375,10.876734 12.38627,13.149829 h -0.468256 c 0.366297,-2.510461 1.102665,-4.4607681 2.475335,-5.7062025 l 0.377622,-0.389497 c 0.557001,-0.426561 0.936512,-1.862952 0.874202,-2.745359 -0.02756,-0.446367 0.35395,-0.490465 0.39651,-0.07412 0.207691,1.472571 -0.594759,2.875074 -1.012036,3.208981"
       style="fill:url(#linearGradient67);stroke:#000000;stroke-width:0.2;stroke-miterlimit:10" />
    <rect style="fill:#646464;stroke:#000000;stroke-width:0.2;stroke-linejoin:bevel;paint-order:fill markers stroke"
       id="rect3-5-9" width="1.4949892" height="1.6996435"
       x="18.445797" y="1.333763" ry="0.5291667" transform="rotate(49.172503)" />
    <g id="g3-6" transform="matrix(0.53521686,0,0,0.50026511,-423.65745,-470.92997)" style="fill:#646464">
      <rect style="fill:#646464;stroke:#000000;stroke-width:0.386514;stroke-linejoin:bevel;paint-order:fill markers stroke"
         id="rect3-20" width="2.7932401" height="3.3974857" x="812.96722" y="967.64655" ry="1.0577725" />
    </g>

    <!-- 6 drifting hormones -->
    <g fill="#5fcf78">
      <circle class="drift d1" cx="0" cy="0" r="0.25" />
      <circle class="drift d2" cx="0" cy="0" r="0.2"  />
      <circle class="drift d3" cx="0" cy="0" r="0.23" />
      <circle class="drift d4" cx="0" cy="0" r="0.18" />
      <circle class="drift d5" cx="0" cy="0" r="0.22" />
      <circle class="drift d6" cx="0" cy="0" r="0.19" />
    </g>

    <!-- The binding hormone (sticks at tip) -->
    <circle class="binder" cx="0" cy="0" r="0.26" fill="#5fcf78" />

    <!-- Capture glow at tip -->
    <circle class="capture" cx="15.84" cy="4" r="0.35" fill="#8fff9f" filter="url(#softGlow)" />

    <!-- Green ball sliding down the cilium -->
    <circle class="ball" cx="0" cy="0" r="0.65" fill="#5fcf78" filter="url(#softGlow)" />
  </g>
</svg>